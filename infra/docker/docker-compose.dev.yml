services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vrav
      POSTGRES_PASSWORD: vrav
      POSTGRES_DB: vrav
    ports:
      - "5432:5432"
    volumes:
      - vrav_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vrav -d vrav"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  vrav_pg_data:
