name: CI

on:
  push:
    branches: [main, master, recovery/vrav-c25-stage-b]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install deps
        run: |
          pip install -U pip
          pip install -r apps/api/requirements.txt
          # CI-only: vector extension helpers for Postgres tests
          pip install pgvector
          pip install ruff

      - name: Ruff (Stage B changed paths)
        working-directory: apps/api
        run: |
          ruff check app/api/organizations.py tests/test_phase_c25_org_member_lifecycle.py tests/test_phase_c25_stage_a_security_audit.py tests/test_phase_c25_stage_b1_concurrency.py

      - name: Unit tests
        working-directory: apps/api
        env:
          PYTHONPATH: ".:../../packages/ai-gateway:../../packages/core"
          SECRET_KEY: ci-secret-key-for-tests
        run: >
          pytest -q tests/
          --ignore=tests/test_phase_c25_org_member_lifecycle.py
          --ignore=tests/test_phase_c25_stage_a_security_audit.py
          --ignore=tests/test_phase_c25_stage_b1_concurrency.py

  e2e:
    runs-on: ubuntu-latest
    needs: unit
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: vrav
          POSTGRES_PASSWORD: vrav
          POSTGRES_DB: vrav
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vrav -d vrav"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          pip install -U pip
          pip install -r apps/api/requirements.txt
          # CI-only: vector extension helpers for Postgres tests
          pip install pgvector

      - name: Verify PostgreSQL server version is 16.15
        env:
          PGPASSWORD: vrav
        run: |
          set -euo pipefail
          ver=$(psql -h localhost -U vrav -d vrav -Atc "SHOW server_version;")
          echo "PostgreSQL server_version=$ver"
          case "$ver" in
            16.15*) echo "PostgreSQL version OK: $ver" ;;
            *) echo "ERROR: expected PostgreSQL 16.15, got: $ver"; exit 1 ;;
          esac

      - name: Migration 018 isolated upgrade/downgrade validation
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://vrav:vrav@localhost:5432/vrav_mig018
          DATABASE_URL_SYNC: postgresql://vrav:vrav@localhost:5432/vrav_mig018
          PYTHONPATH: ".:../../packages/ai-gateway:../../packages/core"
          SECRET_KEY: ci-secret
          PGPASSWORD: vrav
        run: |
          set -euo pipefail
          psql -h localhost -U vrav -d vrav -c "SELECT 1 FROM pg_database WHERE datname='vrav_mig018'" | grep -q 1 \
            || psql -h localhost -U vrav -d vrav -c "CREATE DATABASE vrav_mig018;"
          alembic -c alembic.ini upgrade head
          alembic -c alembic.ini downgrade 017
          alembic -c alembic.ini upgrade head
          echo "Migration 018 upgrade/downgrade/upgrade OK on isolated DB"

      - name: Migrate
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://vrav:vrav@localhost:5432/vrav
          DATABASE_URL_SYNC: postgresql://vrav:vrav@localhost:5432/vrav
          PYTHONPATH: ".:../../packages/ai-gateway:../../packages/core"
          SECRET_KEY: ci-secret
        run: alembic -c alembic.ini upgrade head

      - name: E2E script
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://vrav:vrav@localhost:5432/vrav
          PYTHONPATH: ".:../../packages/ai-gateway:../../packages/core"
          SECRET_KEY: ci-secret
        run: python ../../scripts/e2e_render_offline.py

      - name: PostgreSQL billing integration tests
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://vrav:vrav@localhost:5432/vrav
          PYTHONPATH: ".:../../packages/ai-gateway:../../packages/core"
          SECRET_KEY: ci-secret-key-for-tests
        run: pytest -q tests/test_billing_postgres_integration.py tests/test_iter9_billing_p0.py tests/test_iter10_webhook_outcomes.py tests/test_billing_postgres_extra_iter10.py -v --tb=short

      - name: PostgreSQL segment index regression (Phase B.2.1)
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://vrav:vrav@localhost:5432/vrav
          DATABASE_URL_SYNC: postgresql://vrav:vrav@localhost:5432/vrav
          PYTHONPATH: ".:../../packages/ai-gateway:../../packages/core"
          SECRET_KEY: ci-secret-key-for-tests
          ENVIRONMENT: test
        run: |
          set -euo pipefail
          pytest tests/test_phase_b21_postgres_segment_index.py -v --tb=short | tee /tmp/b21_pg.txt
          # Must execute against real Postgres — zero unexpected skips
          if grep -E '[1-9][0-9]* skipped' /tmp/b21_pg.txt; then
            echo "ERROR: Phase B.2.1 PostgreSQL tests were skipped; DATABASE_URL must force execution"
            exit 1
          fi
          grep -E '[0-9]+ passed' /tmp/b21_pg.txt

      - name: PostgreSQL multi-tenant authorization matrix (Phase C.2.3.1)
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://vrav:vrav@localhost:5432/vrav
          DATABASE_URL_SYNC: postgresql://vrav:vrav@localhost:5432/vrav
          PYTHONPATH: ".:../../packages/ai-gateway:../../packages/core"
          SECRET_KEY: ci-secret-key-for-tests
          ENVIRONMENT: test
        run: |
          set -euo pipefail
          pytest tests/test_phase_c231_multitenant_authorization.py tests/test_phase_c231_multitenant_authorization_part2.py -v --tb=short | tee /tmp/c231_pg.txt
          # Real Postgres required — any skip is a hard failure
          if grep -E '[1-9][0-9]* skipped' /tmp/c231_pg.txt; then
            echo "ERROR: C.2.3.1 PostgreSQL tests were skipped; DATABASE_URL must force execution"
            exit 1
          fi
          # Enforce exact collected/passed count (20 independent scenarios)
          if ! grep -Eq '(^|[^0-9])20 passed' /tmp/c231_pg.txt; then
            echo "ERROR: expected 20 passed C.2.3.1 tests"
            cat /tmp/c231_pg.txt
            exit 1
          fi
          if grep -Eq '[1-9][0-9]* failed' /tmp/c231_pg.txt; then
            echo "ERROR: C.2.3.1 failures detected"
            exit 1
          fi
          echo "C.2.3.1 PostgreSQL multi-tenant matrix: 20 passed, 0 skipped"

      - name: PostgreSQL HTTP multi-tenant authorization (Phase C.2.3.2)
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://vrav:vrav@localhost:5432/vrav
          DATABASE_URL_SYNC: postgresql://vrav:vrav@localhost:5432/vrav
          PYTHONPATH: ".:../../packages/ai-gateway:../../packages/core"
          SECRET_KEY: ci-secret-key-for-tests
          ENVIRONMENT: test
          STORAGE_BACKEND: local
          LOCAL_STORAGE_PATH: /tmp/vrav-c232-storage
        run: |
          set -euo pipefail
          pytest tests/test_phase_c232_http_authorization.py -v --tb=short | tee /tmp/c232_pg.txt
          if grep -E '[1-9][0-9]* skipped' /tmp/c232_pg.txt; then
            echo "ERROR: C.2.3.2 PostgreSQL HTTP tests were skipped; DATABASE_URL must force execution"
            exit 1
          fi
          # Enforce exact collected/passed count (22 independent HTTP scenarios)
          if ! grep -Eq '(^|[^0-9])22 passed' /tmp/c232_pg.txt; then
            echo "ERROR: expected 22 passed C.2.3.2 tests"
            cat /tmp/c232_pg.txt
            exit 1
          fi
          if grep -Eq '[1-9][0-9]* failed' /tmp/c232_pg.txt; then
            echo "ERROR: C.2.3.2 failures detected"
            exit 1
          fi
          echo "C.2.3.2 PostgreSQL HTTP multi-tenant matrix: 22 passed, 0 skipped"

      - name: PostgreSQL HTTP security evidence (Phase C.2.3.3)
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://vrav:vrav@localhost:5432/vrav
          DATABASE_URL_SYNC: postgresql://vrav:vrav@localhost:5432/vrav
          PYTHONPATH: ".:../../packages/ai-gateway:../../packages/core"
          SECRET_KEY: ci-secret-key-for-tests
          ENVIRONMENT: test
          STORAGE_BACKEND: local
          LOCAL_STORAGE_PATH: /tmp/vrav-c233-storage
        run: |
          set -euo pipefail
          pytest tests/test_phase_c233_security_evidence.py -v --tb=short | tee /tmp/c233_pg.txt
          if grep -E '[1-9][0-9]* skipped' /tmp/c233_pg.txt; then
            echo "ERROR: C.2.3.3 tests were skipped; DATABASE_URL must force execution"
            exit 1
          fi
          if ! grep -Eq '(^|[^0-9])8 passed' /tmp/c233_pg.txt; then
            echo "ERROR: expected 8 passed C.2.3.3 tests"
            cat /tmp/c233_pg.txt
            exit 1
          fi
          if grep -Eq '[1-9][0-9]* failed' /tmp/c233_pg.txt; then
            echo "ERROR: C.2.3.3 failures detected"
            exit 1
          fi
          echo "C.2.3.3 PostgreSQL HTTP security evidence: 8 passed, 0 skipped"

      - name: PostgreSQL organization RBAC (Phase C.2.4)
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://vrav:vrav@localhost:5432/vrav
          DATABASE_URL_SYNC: postgresql://vrav:vrav@localhost:5432/vrav
          PYTHONPATH: ".:../../packages/ai-gateway:../../packages/core"
          SECRET_KEY: ci-secret-key-for-tests
          ENVIRONMENT: test
          STORAGE_BACKEND: local
          LOCAL_STORAGE_PATH: /tmp/vrav-c24-storage
        run: |
          set -euo pipefail
          pytest tests/test_phase_c24_rbac_http.py -v --tb=short | tee /tmp/c24_pg.txt
          if ! grep -Eq '(^|[^0-9])14 passed' /tmp/c24_pg.txt; then
            echo "ERROR: expected 14 passed C.2.4 tests"
            cat /tmp/c24_pg.txt
            exit 1
          fi
          if grep -Eq '[1-9][0-9]* failed' /tmp/c24_pg.txt; then
            echo "ERROR: C.2.4 failures detected"
            exit 1
          fi
          if grep -E '[1-9][0-9]* skipped' /tmp/c24_pg.txt; then
            echo "ERROR: C.2.4 tests were skipped; DATABASE_URL must force execution"
            exit 1
          fi
          echo "C.2.4 PostgreSQL organization RBAC: 14 passed, 0 skipped"


      - name: PostgreSQL security audit service (Phase C.2.5 Stage A)
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://vrav:vrav@localhost:5432/vrav
          DATABASE_URL_SYNC: postgresql://vrav:vrav@localhost:5432/vrav
          PYTHONPATH: ".:../../packages/ai-gateway:../../packages/core"
          SECRET_KEY: ci-secret-key-for-tests
          ENVIRONMENT: test
        run: |
          set -euo pipefail
          pytest tests/test_phase_c25_stage_a_security_audit.py -v --tb=short -ra | tee /tmp/c25_stage_a_pg.txt
          if grep -E '[1-9][0-9]* skipped' /tmp/c25_stage_a_pg.txt; then
            echo "ERROR: C.2.5 Stage A audit tests were skipped; DATABASE_URL must force execution"
            exit 1
          fi
          if grep -Eq '[1-9][0-9]* failed' /tmp/c25_stage_a_pg.txt; then
            echo "ERROR: C.2.5 Stage A audit failures detected"
            cat /tmp/c25_stage_a_pg.txt
            exit 1
          fi
          if ! grep -Eq '[1-9][0-9]* passed' /tmp/c25_stage_a_pg.txt; then
            echo "ERROR: expected non-zero passed C.2.5 Stage A tests"
            cat /tmp/c25_stage_a_pg.txt
            exit 1
          fi
          echo "C.2.5 Stage A security_audit: see /tmp/c25_stage_a_pg.txt"

      - name: Upload Stage A security audit pytest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c25-stage-a-security-audit-log
          path: /tmp/c25_stage_a_pg.txt
          if-no-files-found: ignore


      - name: PostgreSQL organization member lifecycle (Phase C.2.5 Stage B)
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://vrav:vrav@localhost:5432/vrav
          DATABASE_URL_SYNC: postgresql://vrav:vrav@localhost:5432/vrav
          PYTHONPATH: ".:../../packages/ai-gateway:../../packages/core"
          SECRET_KEY: ci-secret-key-for-tests
          ENVIRONMENT: test
          STORAGE_BACKEND: local
          LOCAL_STORAGE_PATH: /tmp/vrav-c25-storage
        run: |
          set -euo pipefail
          pytest tests/test_phase_c25_org_member_lifecycle.py -v --tb=short -ra | tee /tmp/c25_pg.txt
          if grep -E '[1-9][0-9]* skipped' /tmp/c25_pg.txt; then
            echo "ERROR: C.2.5 Stage B tests were skipped; DATABASE_URL must force execution"
            exit 1
          fi
          if grep -Eq '[1-9][0-9]* failed' /tmp/c25_pg.txt; then
            echo "ERROR: C.2.5 Stage B failures detected"
            cat /tmp/c25_pg.txt
            exit 1
          fi
          if ! grep -Eq '[1-9][0-9]* passed' /tmp/c25_pg.txt; then
            echo "ERROR: expected non-zero passed C.2.5 Stage B tests"
            cat /tmp/c25_pg.txt
            exit 1
          fi
          echo "C.2.5 Stage B PostgreSQL lifecycle: see /tmp/c25_pg.txt"

      - name: Upload Stage B pytest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c25-stage-b-pytest-log
          path: /tmp/c25_pg.txt
          if-no-files-found: ignore

      - name: PostgreSQL Stage B.1 concurrency (Phase C.2.5)
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://vrav:vrav@localhost:5432/vrav
          DATABASE_URL_SYNC: postgresql://vrav:vrav@localhost:5432/vrav
          PYTHONPATH: ".:../../packages/ai-gateway:../../packages/core"
          SECRET_KEY: ci-secret-key-for-tests
          ENVIRONMENT: test
          STORAGE_BACKEND: local
          LOCAL_STORAGE_PATH: /tmp/vrav-c25-b1-storage
        run: |
          set -euo pipefail
          OUT=/tmp/c25_b1_pg.txt
          JUNIT=/tmp/c25_b1_junit.xml
          set +e
          pytest tests/test_phase_c25_stage_b1_concurrency.py -v --tb=short -ra \
            --junitxml="$JUNIT" | tee "$OUT"
          PYTEST_RC=${PIPESTATUS[0]}
          set -e
          if ! grep -Eq 'collected [1-9][0-9]* item' "$OUT" \
            && ! grep -Eq '[1-9][0-9]* passed' "$OUT"; then
            echo "ERROR: Stage B.1 collected/executed zero tests"
            exit 1
          fi
          if grep -E '[1-9][0-9]* skipped' "$OUT"; then
            echo "ERROR: Stage B.1 must not skip"
            exit 1
          fi
          if grep -Eq '[1-9][0-9]* failed|[1-9][0-9]* error' "$OUT"; then
            echo "ERROR: Stage B.1 failures/errors detected"
            cat "$OUT"
            exit 1
          fi
          python3 - <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse("/tmp/c25_b1_junit.xml").getroot()
          suites = root.findall(".//testsuite") or ([root] if root.tag == "testsuite" else [])
          tests = sum(int(s.get("tests") or 0) for s in suites)
          skipped = sum(int(s.get("skipped") or 0) for s in suites)
          failures = sum(int(s.get("failures") or 0) for s in suites)
          errors = sum(int(s.get("errors") or 0) for s in suites)
          print(f"junit tests={tests} skipped={skipped} failures={failures} errors={errors}")
          if tests < 1 or skipped or failures or errors:
              sys.exit(1)
          PY
          echo "C.2.5 Stage B.1 concurrency: see $OUT"
          exit "$PYTEST_RC"

      - name: Upload Stage B.1 concurrency pytest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c25-stage-b1-concurrency-log
          path: |
            /tmp/c25_b1_pg.txt
            /tmp/c25_b1_junit.xml
          if-no-files-found: ignore
