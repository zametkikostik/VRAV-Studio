# Optional: Prometheus Operator ServiceMonitor
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: vrav-api
  namespace: vrav
  labels:
    app: vrav-api
spec:
  selector:
    matchLabels:
      app: vrav-api
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
