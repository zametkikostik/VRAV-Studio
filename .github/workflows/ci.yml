name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install deps
        run: |
          pip install -U pip
          pip install -r apps/api/requirements.txt
          # CI-only: vector extension helpers for Postgres tests
          pip install pgvector

      - name: Unit tests
        working-directory: apps/api
        env:
          PYTHONPATH: ".:../../packages/ai-gateway:../../packages/core"
          SECRET_KEY: ci-secret-key-for-tests
        run: pytest -q tests/

  e2e:
    runs-on: ubuntu-latest
    needs: unit
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vrav
          POSTGRES_PASSWORD: vrav
          POSTGRES_DB: vrav
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vrav -d vrav"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install
        run: |
          pip install -U pip
          pip install -r apps/api/requirements.txt
          # CI-only: vector extension helpers for Postgres tests
          pip install pgvector

      - name: Migrate
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://vrav:vrav@localhost:5432/vrav
          DATABASE_URL_SYNC: postgresql://vrav:vrav@localhost:5432/vrav
          PYTHONPATH: ".:../../packages/ai-gateway:../../packages/core"
          SECRET_KEY: ci-secret
        run: alembic -c alembic.ini upgrade head

      - name: E2E script
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://vrav:vrav@localhost:5432/vrav
          PYTHONPATH: ".:../../packages/ai-gateway:../../packages/core"
          SECRET_KEY: ci-secret
        run: python ../../scripts/e2e_render_offline.py

      - name: PostgreSQL billing integration tests
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://vrav:vrav@localhost:5432/vrav
          PYTHONPATH: ".:../../packages/ai-gateway:../../packages/core"
          SECRET_KEY: ci-secret-key-for-tests
        run: pytest -q tests/test_billing_postgres_integration.py tests/test_iter9_billing_p0.py tests/test_iter10_webhook_outcomes.py tests/test_billing_postgres_extra_iter10.py -v --tb=short

      - name: PostgreSQL segment index regression (Phase B.2.1)
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://vrav:vrav@localhost:5432/vrav
          DATABASE_URL_SYNC: postgresql://vrav:vrav@localhost:5432/vrav
          PYTHONPATH: ".:../../packages/ai-gateway:../../packages/core"
          SECRET_KEY: ci-secret-key-for-tests
          ENVIRONMENT: test
        run: |
          set -euo pipefail
          pytest tests/test_phase_b21_postgres_segment_index.py -v --tb=short | tee /tmp/b21_pg.txt
          # Must execute against real Postgres — zero unexpected skips
          if grep -E '[1-9][0-9]* skipped' /tmp/b21_pg.txt; then
            echo "ERROR: Phase B.2.1 PostgreSQL tests were skipped; DATABASE_URL must force execution"
            exit 1
          fi
          grep -E '[0-9]+ passed' /tmp/b21_pg.txt

      - name: PostgreSQL multi-tenant authorization matrix (Phase C.2.3.1)
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://vrav:vrav@localhost:5432/vrav
          DATABASE_URL_SYNC: postgresql://vrav:vrav@localhost:5432/vrav
          PYTHONPATH: ".:../../packages/ai-gateway:../../packages/core"
          SECRET_KEY: ci-secret-key-for-tests
          ENVIRONMENT: test
        run: |
          set -euo pipefail
          pytest tests/test_phase_c231_multitenant_authorization.py tests/test_phase_c231_multitenant_authorization_part2.py -v --tb=short | tee /tmp/c231_pg.txt
          # Real Postgres required — any skip is a hard failure
          if grep -E '[1-9][0-9]* skipped' /tmp/c231_pg.txt; then
            echo "ERROR: C.2.3.1 PostgreSQL tests were skipped; DATABASE_URL must force execution"
            exit 1
          fi
          # Enforce exact collected/passed count (20 independent scenarios)
          if ! grep -Eq '20 passed' /tmp/c231_pg.txt; then
            echo "ERROR: expected 20 passed C.2.3.1 tests"
            cat /tmp/c231_pg.txt
            exit 1
          fi
          if grep -Eq '[1-9][0-9]* failed' /tmp/c231_pg.txt; then
            echo "ERROR: C.2.3.1 failures detected"
            exit 1
          fi
          echo "C.2.3.1 PostgreSQL multi-tenant matrix: 20 passed, 0 skipped"

      - name: PostgreSQL HTTP multi-tenant authorization (Phase C.2.3.2)
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://vrav:vrav@localhost:5432/vrav
          DATABASE_URL_SYNC: postgresql://vrav:vrav@localhost:5432/vrav
          PYTHONPATH: ".:../../packages/ai-gateway:../../packages/core"
          SECRET_KEY: ci-secret-key-for-tests
          ENVIRONMENT: test
        run: |
          set -euo pipefail
          pytest tests/test_phase_c232_http_authorization.py -v --tb=short | tee /tmp/c232_pg.txt
          if grep -E '[1-9][0-9]* skipped' /tmp/c232_pg.txt; then
            echo "ERROR: C.2.3.2 PostgreSQL HTTP tests were skipped; DATABASE_URL must force execution"
            exit 1
          fi
          if ! grep -Eq '22 passed' /tmp/c232_pg.txt; then
            echo "ERROR: expected 22 passed C.2.3.2 HTTP authorization tests"
            cat /tmp/c232_pg.txt
            exit 1
          fi
          if grep -Eq '[1-9][0-9]* failed' /tmp/c232_pg.txt; then
            echo "ERROR: C.2.3.2 failures detected"
            exit 1
          fi
          echo "C.2.3.2 PostgreSQL HTTP multi-tenant authorization: 22 passed, 0 skipped"

      - name: HTTP API E2E smoke
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://vrav:vrav@localhost:5432/vrav
          PYTHONPATH: ".:../../packages/ai-gateway:../../packages/core"
          SECRET_KEY: ci-e2e-http-secret-key-32chars!!
          ENVIRONMENT: development
        run: python ../../scripts/e2e_http_api.py

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        working-directory: apps/web
        run: npm install
      - name: Typecheck / build
        working-directory: apps/web
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  docker-runtime:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker + Redis + Celery runtime smoke
        run: bash scripts/docker_runtime_smoke.sh

      - name: Validate production compose file
        run: |
          bash scripts/validate_compose_prod.sh

      - name: Compose validation negative cases
        run: |
          bash scripts/test_validate_compose_prod_negative.sh
