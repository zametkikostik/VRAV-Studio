apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vrav.name" . }}-api
  labels:
    {{- include "vrav.labels" . | nindent 4 }}
    app: vrav-api
spec:
  replicas: {{ .Values.replicaCount.api }}
  selector:
    matchLabels:
      app: vrav-api
  template:
    metadata:
      labels:
        app: vrav-api
    spec:
      containers:
        - name: api
          image: {{ .Values.image.api }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: {{ include "vrav.name" . }}-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources.api | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vrav.name" . }}-api
  labels:
    {{- include "vrav.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: vrav-api
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
