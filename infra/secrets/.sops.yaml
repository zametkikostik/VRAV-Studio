# SOPS rules: encrypt all values in secrets/*.env and secrets/*.yaml
# Install: https://github.com/getsops/sops
# Example age key: age-keygen -o keys.txt
creation_rules:
  - path_regex: secrets/.*\.(env|yaml|yml)$
    # Replace with your age recipient or pgp fingerprint
    age: age1examplepublickeyreplacewithyours0000000000000000000000000
