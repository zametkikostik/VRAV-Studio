services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vrav}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-vrav}
    volumes:
      - vrav_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vrav} -d ${POSTGRES_DB:-vrav}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - vrav_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    restart: unless-stopped
    env_file:
      - ${VRV_ENV_FILE:-../../.env.production}
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vrav}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vrav}
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_BACKEND: redis
      LOG_JSON: "true"
      ENVIRONMENT: production
    ports:
      - "${API_PUBLISH_PORT:-8000}:8000"
    volumes:
      - vrav_storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker
    restart: unless-stopped
    env_file:
      - ${VRV_ENV_FILE:-../../.env.production}
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vrav}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vrav}
    volumes:
      - vrav_storage:/data/storage
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started

  beat:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker
    restart: unless-stopped
    command: ["celery", "-A", "worker.celery_app", "beat", "--loglevel=info"]
    env_file:
      - ${VRV_ENV_FILE:-../../.env.production}
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vrav}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vrav}
    depends_on:
      - worker

volumes:
  vrav_pg_data:
  vrav_redis_data:
  vrav_storage:
