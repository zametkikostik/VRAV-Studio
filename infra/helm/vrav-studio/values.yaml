image:
  api: vrav/api:0.1.0
  worker: vrav/worker:0.1.0
  pullPolicy: IfNotPresent

replicaCount:
  api: 2
  worker: 1

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: false
  className: nginx
  host: studio.example.com
  tls: false

env:
  ENVIRONMENT: production
  STORAGE_BACKEND: s3

secrets:
  SECRET_KEY: "change-me"
  DATABASE_URL: "postgresql+asyncpg://vrav:vrav@postgres:5432/vrav"
  REDIS_URL: "redis://redis:6379/0"
  XAI_API_KEY: ""
  OPENROUTER_API_KEY: ""
  ROUTERAI_API_KEY: ""
  S3_ENDPOINT: ""
  S3_ACCESS_KEY: ""
  S3_SECRET_KEY: ""
  S3_BUCKET: vrav

resources:
  api:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }
  worker:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }

postgresql:
  enabled: false

redis:
  enabled: false
