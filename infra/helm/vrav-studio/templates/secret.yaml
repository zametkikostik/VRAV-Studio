apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vrav.name" . }}-secrets
  labels:
    {{- include "vrav.labels" . | nindent 4 }}
type: Opaque
stringData:
  SECRET_KEY: {{ .Values.secrets.SECRET_KEY | quote }}
  DATABASE_URL: {{ .Values.secrets.DATABASE_URL | quote }}
  REDIS_URL: {{ .Values.secrets.REDIS_URL | quote }}
  XAI_API_KEY: {{ .Values.secrets.XAI_API_KEY | quote }}
  OPENROUTER_API_KEY: {{ .Values.secrets.OPENROUTER_API_KEY | quote }}
  ROUTERAI_API_KEY: {{ .Values.secrets.ROUTERAI_API_KEY | quote }}
  S3_ENDPOINT: {{ .Values.secrets.S3_ENDPOINT | quote }}
  S3_ACCESS_KEY: {{ .Values.secrets.S3_ACCESS_KEY | quote }}
  S3_SECRET_KEY: {{ .Values.secrets.S3_SECRET_KEY | quote }}
  S3_BUCKET: {{ .Values.secrets.S3_BUCKET | quote }}
  ENVIRONMENT: {{ .Values.env.ENVIRONMENT | quote }}
  STORAGE_BACKEND: {{ .Values.env.STORAGE_BACKEND | quote }}
