name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install deps
        run: |
          pip install -U pip
          pip install -r apps/api/requirements.txt
          # CI-only: vector extension helpers for Postgres tests
          pip install pgvector

      - name: Unit tests
        working-directory: apps/api
        env:
          PYTHONPATH: ".:../../packages/ai-gateway:../../packages/core"
          SECRET_KEY: ci-secret-key-for-tests
        run: pytest -q tests/

  e2e:
    runs-on: ubuntu-latest
    needs: unit
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vrav
          POSTGRES_PASSWORD: vrav
          POSTGRES_DB: vrav
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vrav -d vrav"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install
        run: |
          pip install -U pip
          pip install -r apps/api/requirements.txt
          # CI-only: vector extension helpers for Postgres tests
          pip install pgvector

      - name: Migrate
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://vrav:vrav@localhost:5432/vrav
          DATABASE_URL_SYNC: postgresql://vrav:vrav@localhost:5432/vrav
          PYTHONPATH: ".:../../packages/ai-gateway:../../packages/core"
          SECRET_KEY: ci-secret
        run: alembic -c alembic.ini upgrade head

      - name: E2E script
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://vrav:vrav@localhost:5432/vrav
          PYTHONPATH: ".:../../packages/ai-gateway:../../packages/core"
          SECRET_KEY: ci-secret
        run: python ../../scripts/e2e_render_offline.py

      - name: PostgreSQL billing integration tests
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://vrav:vrav@localhost:5432/vrav
          PYTHONPATH: ".:../../packages/ai-gateway:../../packages/core"
          SECRET_KEY: ci-secret-key-for-tests
        run: pytest -q tests/test_billing_postgres_integration.py tests/test_iter9_billing_p0.py tests/test_iter10_webhook_outcomes.py tests/test_billing_postgres_extra_iter10.py -v --tb=short

      - name: HTTP API E2E smoke
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://vrav:vrav@localhost:5432/vrav
          PYTHONPATH: ".:../../packages/ai-gateway:../../packages/core"
          SECRET_KEY: ci-e2e-http-secret-key-32chars!!
          ENVIRONMENT: development
        run: python ../../scripts/e2e_http_api.py

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        working-directory: apps/web
        run: npm install
      - name: Typecheck / build
        working-directory: apps/web
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  docker-runtime:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker + Redis + Celery runtime smoke
        run: bash scripts/docker_runtime_smoke.sh

      - name: Validate production compose file
        run: |
          bash scripts/validate_compose_prod.sh
